<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>اتمام الشراء - Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shop/styles.css?v=202604021">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
  <header class="header">
    <div class="container header-inner">
      <a href="/shop/index.html" class="brand">
        <img src="/images/logo.png?v=202604031" alt="Store"
          onerror="this.src='https://dummyimage.com/48x48/09090b/ffffff&text=S'" />
        <span>Store</span>
      </a>

      <nav class="nav">
        <a href="/shop/index.html">الرئيسية</a>
        <a href="/shop/products.html">جميع المنتجات</a>
        <a href="/shop/categories.html">الأقسام</a>
        <a href="/shop/products.html?sort=discount">عروض حصرية</a>
        <a style="display:none !important;" href="/shop/contact.html">اتصل بنا</a>
      </nav>

      <div class="icons">
        <a href="#" class="icon-round search-trigger" title="بحث" aria-label="بحث"><i class="fa fa-search"></i></a>
        <a id="cartIcon" class="icon-round" href="/shop/cart.html" title="السلة" aria-label="السلة">
          <i class="fa-solid fa-bag-shopping"></i>
          <span id="cartCount"></span>
        </a>
        <button class="menu-toggle" aria-label="القائمة"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title" style="margin: 1.5rem 0 1rem 0; font-size: 1.6rem; font-weight: 900; color: #09090b;">إتمام الشراء</h1>

    <div id="checkoutWrap" style="display:grid;grid-template-columns:1fr 350px;gap:24px;margin-bottom:24px;">
      <!-- Left: Form -->
      <div class="card" style="padding:24px;border:1px solid #e4e4e7;border-radius:16px;">
        <h2 style="font-size:18px;font-weight:800;color:#09090b;margin-bottom:20px;padding-bottom:12px;border-bottom:1.5px solid #f4f4f5;">
          بيانات الشحن والاستلام</h2>

        <form id="checkoutForm" style="display:grid;gap:20px;">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div>
              <label style="display:block;margin-bottom:8px;font-weight:700;color:#09090b;">الاسم الكامل <span style="color:#ef4444">*</span></label>
              <input required name="name" type="text"
                style="width:100%;padding:12px 16px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;font-family:Cairo,sans-serif;transition:border-color .2s;"
                onfocus="this.style.borderColor='#09090b'" onblur="this.style.borderColor='#e4e4e7'">
            </div>
            <div>
              <label style="display:block;margin-bottom:8px;font-weight:700;color:#09090b;">رقم الهاتف <span style="color:#ef4444">*</span></label>
              <input required name="phone" id="phoneInput" type="tel" inputmode="text" maxlength="11"
                placeholder="رقم الهاتف (مثل: 01012345678)"
                style="width:100%;padding:12px 16px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;font-family:Cairo,sans-serif;transition:all .2s;"
                onfocus="this.style.borderColor='#09090b'" onblur="this.style.borderColor='#e4e4e7'" dir="rtl">
              <div id="phoneErrorMsg" style="color: #ef4444; font-size: 0.85rem; margin-top: 6px; display: none; font-weight: 600;">يجب أن يكون رقم الهاتف 11 رقماً ويبدأ بـ 01 (مثل: 01012345678)</div>
            </div>
          </div>

          <div>
            <label style="display:block;margin-bottom:8px;font-weight:700;color:#09090b;">المحافظة <span style="color:#ef4444">*</span></label>
            <select required name="governorate_id" id="governorateSelect"
              style="width:100%;padding:12px 16px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;font-family:Cairo,sans-serif;background:#fff;cursor:pointer;"
              onfocus="this.style.borderColor='#09090b'" onblur="this.style.borderColor='#e4e4e7'"
              onchange="updateShipping()">
              <option value="">جاري التحميل...</option>
            </select>
          </div>

          <div>
            <label style="display:block;margin-bottom:8px;font-weight:700;color:#09090b;">العنوان بالتفصيل <span style="color:#ef4444">*</span></label>
            <textarea required name="address" rows="3" placeholder="اسم الشارع، رقم العمارة، الشقة، علامة مميزة"
              style="width:100%;padding:12px 16px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;font-family:Cairo,sans-serif;resize:vertical;"
              onfocus="this.style.borderColor='#09090b'" onblur="this.style.borderColor='#e4e4e7'"></textarea>
          </div>

          <div>
            <label style="display:block;margin-bottom:8px;font-weight:700;color:#09090b;">ملاحظات إضافية</label>
            <textarea name="notes" rows="2" placeholder="أي ملاحظات بخصوص موعد التوصيل أو الاستلام"
              style="width:100%;padding:12px 16px;border:1.5px solid #e4e4e7;border-radius:10px;font-size:15px;font-family:Cairo,sans-serif;resize:vertical;"
              onfocus="this.style.borderColor='#09090b'" onblur="this.style.borderColor='#e4e4e7'"></textarea>
          </div>

          <!-- طريقة الدفع -->
          <div>
            <label style="display:block;margin-bottom:8px;font-weight:700;color:#09090b;">طريقة الدفع</label>
            <div style="border:2px solid #09090b;background:#f4f4f5;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;">
              <input type="radio" name="payment_method" value="cod" checked id="payCod" style="accent-color:#09090b;width:18px;height:18px;">
              <label for="payCod" style="margin:0;font-weight:800;color:#09090b;cursor:pointer;display:flex;align-items:center;gap:8px;">
                <i class="fa fa-money-bill-wave" style="color:#09090b;"></i>
                الدفع عند الاستلام
              </label>
            </div>
          </div>
        </form>
      </div>

      <!-- Right: Summary -->
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div class="card" style="height: auto !important; padding:24px; border:1px solid #e4e4e7; border-radius:16px;">
          <h2 style="font-size:18px; font-weight:800; color:#09090b; margin-bottom:20px; padding-bottom:12px; border-bottom:1.5px solid #f4f4f5;">
            ملخص الطلب</h2>

          <div id="orderItems" style="display:grid; gap:12px; margin-bottom:20px; max-height:280px; overflow-y:auto;">
            <!-- Items rendered here -->
          </div>

          <div style="border-top:1.5px solid #f4f4f5; padding-top:16px; display:grid; gap:10px;">
            <div style="display:flex; justify-content:space-between; color:#71717a; font-size:15px; font-weight:600;">
              <span>المجموع الفرعي:</span>
              <span id="sumSubtotal" style="font-weight:700; color:#09090b;">0 EGP</span>
            </div>
            <div style="display:flex; justify-content:space-between; color:#71717a; font-size:15px; font-weight:600;">
              <span>الشحن:</span>
              <span id="sumShipping" style="font-weight:700; color:#09090b;">—</span>
            </div>
            <div id="couponRow" style="display:none; justify-content:space-between; color:#16a34a; font-size:15px; font-weight:600;">
              <span>كوبون خصم:</span>
              <span id="sumDiscount" style="font-weight:700;"></span>
            </div>
            <div style="display:flex; justify-content:space-between; border-top:2px dashed #e4e4e7; padding-top:12px; margin-top:4px;">
              <span style="font-size:18px; font-weight:900; color:#09090b;">الإجمالي:</span>
              <span id="sumTotal" style="font-size:1.3rem; font-weight:900; color:#09090b;">0 EGP</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons Box -->
        <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 0;">
          <button form="checkoutForm" type="submit" id="submitBtn"
            style="width:100%; padding:14px 20px; background:#09090b; color:#fff; border:none; border-radius:12px; font-size:1.05rem; font-weight:900; cursor:pointer; font-family:Cairo,sans-serif; transition:all .2s; box-shadow:0 4px 14px rgba(0,0,0,0.15); display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fa fa-check-circle"></i>تأكيد وإرسال الطلب
          </button>
          <a href="/shop/cart.html"
            style="width:100%; padding:12px 20px; background:#ffffff; color:#09090b; border:1.5px solid #09090b; border-radius:12px; font-size:14px; font-weight:700; text-decoration:none; text-align:center; display:block; font-family:Cairo,sans-serif; transition:all .2s; box-sizing:border-box;">
            العودة لسلة المشتريات
          </a>
        </div>
      </div>
    </div>

    <style>
      @media(max-width:768px){
        #checkoutWrap{grid-template-columns:1fr !important; margin-bottom: 20px !important;}
        form>div:first-child{grid-template-columns:1fr !important;}
      }
    </style>
  </main>

  <footer class="container footer" style="margin: 16px auto 16px; padding: 12px 16px; text-align: center; color: #71717a; font-size: 0.85rem; clear: both; display: block; width: 100%;">
    <div>
      © <span id="footYear"></span> Store. جميع الحقوق محفوظة.
    </div>
  </footer>

  <!-- <a class="wapp-float" href="https://wa.me/201066571999" target="_blank" aria-label="WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a> -->

  <script src="/shop/shared.js?v=20260405"></script>
  <script>
    document.getElementById('footYear').textContent = new Date().getFullYear();

    var currentShipping = 0;
    var governorates   = [];

    /* ---- Format ---- */
    function fmt(n) {
      return new Intl.NumberFormat('en-EG', { maximumFractionDigits: 0 }).format(Math.round(Number(n || 0))) + ' EGP';
    }

    /* ---- Load governorates ---- */
    fetch('/public-api/shipping-governorates')
      .then(function(r){ return r.json(); })
      .then(function(res){
        governorates = (res.data || []).filter(function(g){ return g.is_active; });
        var sel = document.getElementById('governorateSelect');
        sel.innerHTML = '<option value="">اختر المحافظة</option>';
        governorates.sort(function(a,b){ return a.name.localeCompare(b.name,'ar'); })
          .forEach(function(g){
            var opt = document.createElement('option');
            opt.value = g.id;
            opt.textContent = g.name;
            opt.dataset.price = g.price;
            sel.appendChild(opt);
          });
        renderSummary();
      })
      .catch(function(){ });

    /* ---- Render order items ---- */
    function renderSummary() {
      var cart = BirdCart.getCart();
      var box  = document.getElementById('orderItems');

      if (!cart.length) {
        box.innerHTML = '<p style="color:#6b7280;text-align:center;padding:16px;">السلة فارغة</p>';
        return;
      }

      var subtotal = 0;
      box.innerHTML = cart.map(function(it) {
        var line = (it.price || 0) * (it.qty || 1);
        subtotal += line;

        var sizeTag  = it.selectedSize  ? '<span style="font-size:.75rem;background:#dbeafe;color:#1e40af;padding:2px 6px;border-radius:4px;margin-right:4px;">المقاس: '+it.selectedSize+'</span>' : '';
        var colorTag = it.selectedColor ? '<span style="font-size:.75rem;background:#fce7f3;color:#be185d;padding:2px 6px;border-radius:4px;margin-right:4px;">اللون: '+it.selectedColor+'</span>' : '';
        var optsTag  = '';
        if (it.options && typeof it.options === 'object') {
          for (var optK in it.options) {
            if (it.options[optK]) {
              optsTag += '<span style="font-size:.75rem;background:#f3e8ff;color:#7e22ce;padding:2px 6px;border-radius:4px;margin-right:4px;">' + optK + ': ' + it.options[optK] + '</span>';
            }
          }
        }

        return '<div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f3f4f6;">' +
          '<div style="flex:1;">' +
            '<div style="font-weight:600;color:#111827;margin-bottom:3px;">' + (it.name||'منتج') + '</div>' +
            (sizeTag||colorTag||optsTag ? '<div style="margin-bottom:4px;">' + sizeTag + colorTag + optsTag + '</div>' : '') +
            '<div style="font-size:14px;color:#6b7280;">الكمية: ' + (it.qty||1) + ' × ' + fmt(it.price) + '</div>' +
          '</div>' +
          '<div style="font-weight:700;color:#4f46e5;margin-right:8px;">' + fmt(line) + '</div>' +
        '</div>';
      }).join('');

      document.getElementById('sumSubtotal').textContent = fmt(subtotal);
      updateTotal(subtotal);
    }

    /* ---- Update shipping ---- */
    function updateShipping() {
      var sel = document.getElementById('governorateSelect');
      var opt = sel.options[sel.selectedIndex];
      currentShipping = opt && opt.dataset.price ? parseInt(opt.dataset.price) : 0;
      var shEl = document.getElementById('sumShipping');
      shEl.textContent = currentShipping > 0 ? fmt(currentShipping) : '—';
      shEl.style.color  = currentShipping > 0 ? '#4f46e5' : '#9ca3af';

      var cart     = BirdCart.getCart();
      var subtotal = cart.reduce(function(s,it){ return s + (it.price||0)*(it.qty||1); }, 0);
      updateTotal(subtotal);
    }

    function updateTotal(subtotal) {
      var couponCode = localStorage.getItem('ordersaif_coupon_code');
      var couponType = localStorage.getItem('ordersaif_coupon_type');
      var couponValue = parseFloat(localStorage.getItem('ordersaif_coupon_value') || 0);
      var discount = 0;

      if (couponCode && couponValue > 0) {
        if (couponType === 'percentage') {
          discount = (subtotal * couponValue) / 100;
        } else {
          discount = couponValue;
        }
        discount = Math.min(discount, subtotal);
      }

      var row = document.getElementById('couponRow');
      var discEl = document.getElementById('sumDiscount');
      if (discount > 0 && couponCode) {
        row.style.display = 'flex';
        discEl.textContent = '−' + fmt(discount);
      } else {
        row.style.display = 'none';
      }

      var finalTotal = Math.max(0, subtotal - discount + currentShipping);
      document.getElementById('sumTotal').textContent = fmt(finalTotal);
    }

    /* ---- Phone Input Realtime Formatting & Validation ---- */
    var pInput = document.getElementById('phoneInput');
    var pErr = document.getElementById('phoneErrorMsg');
    var phoneRegex = /^01[0125][0-9]{8}$/;

    if (pInput) {
      pInput.addEventListener('input', function() {
        // Strip non-digits completely
        var val = this.value.replace(/\D/g, '');
        
        // Force starting with 01 if user types other numbers
        if (val.length >= 1 && val[0] !== '0') {
          val = '0' + val;
        }
        if (val.length >= 2 && val[1] !== '1') {
          val = '01' + val.slice(2);
        }
        
        // Enforce 11 digits max
        this.value = val.slice(0, 11);

        if (this.value.length === 11) {
          if (phoneRegex.test(this.value)) {
            this.style.borderColor = '#10b981';
            this.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.15)';
            if (pErr) pErr.style.display = 'none';
          } else {
            this.style.borderColor = '#ef4444';
            this.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
            if (pErr) pErr.style.display = 'block';
          }
        } else {
          this.style.borderColor = '#e5e7eb';
          this.style.boxShadow = 'none';
          if (pErr) pErr.style.display = 'none';
        }
      });

      pInput.addEventListener('blur', function() {
        if (this.value && (!phoneRegex.test(this.value) || this.value.length !== 11)) {
          this.style.borderColor = '#ef4444';
          this.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
          if (pErr) pErr.style.display = 'block';
        }
      });

      pInput.addEventListener('paste', function(e) {
        var pasted = (e.clipboardData || window.clipboardData).getData('text');
        var clean = pasted.replace(/\D/g, '');
        if (clean.length > 0 && !clean.startsWith('01')) {
          if (clean.startsWith('1')) clean = '0' + clean;
          else clean = '01' + clean;
        }
        this.value = clean.slice(0, 11);
        e.preventDefault();

        if (this.value.length === 11 && phoneRegex.test(this.value)) {
          this.style.borderColor = '#10b981';
          this.style.boxShadow = '0 0 0 3px rgba(16, 185, 129, 0.15)';
          if (pErr) pErr.style.display = 'none';
        }
      });
    }

    /* ---- Form submit ---- */
    document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      var form = e.target;
      var fd   = new FormData(form);
      var name = fd.get('name');
      var phone = (fd.get('phone') || '').replace(/[\s\+\-]/g, '');
      if (phone.startsWith('201')) phone = '0' + phone.substring(2);
      else if (phone.startsWith('00201')) phone = '0' + phone.substring(4);
      var addr = fd.get('address');

      if (!name || !phone || !addr) { alert('يرجى ملء جميع البيانات المطلوبة'); return; }

      // Enforce strictly 11 digits starting with 010, 011, 012, 015
      if (!phone || !phoneRegex.test(phone)) {
        if (pInput) {
          pInput.style.borderColor = '#ef4444';
          pInput.style.boxShadow = '0 0 0 3px rgba(239, 68, 68, 0.2)';
          pInput.focus();
        }
        if (pErr) pErr.style.display = 'block';
        return;
      }

      var sel = document.getElementById('governorateSelect');
      var opt = sel.options[sel.selectedIndex];
      if (!opt || !opt.value) { alert('يرجى اختيار المحافظة'); return; }

      var cart = BirdCart.getCart();
      if (!cart.length) { alert('السلة فارغة'); return; }

      var btn = document.getElementById('submitBtn');
      var orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa fa-spinner fa-spin" style="margin-left:8px;"></i>جاري المعالجة...';
      btn.disabled = true;

      var subtotal = cart.reduce(function(s,it){ return s+(it.price||0)*(it.qty||1); },0);
      
      var couponCode = localStorage.getItem('ordersaif_coupon_code');
      var couponType = localStorage.getItem('ordersaif_coupon_type');
      var couponValue = parseFloat(localStorage.getItem('ordersaif_coupon_value') || 0);
      var discount = 0;

      if (couponCode && couponValue > 0) {
        if (couponType === 'percentage') {
          discount = (subtotal * couponValue) / 100;
        } else {
          discount = couponValue;
        }
        discount = Math.min(discount, subtotal);
      }

      var total = Math.max(0, subtotal - discount + currentShipping);

      try {
        var res = await fetch('/api/orders', {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json', 
            'Accept': 'application/json',
            'X-Requested-With': 'XMLHttpRequest' 
          },
          body: JSON.stringify({
            customer_name:    name,
            customer_phone:   phone,
            customer_address: addr,
            governorate_id:   opt.value,
            payment_method:   'cod',
            coupon_code:      couponCode || null,
            items:            cart,
            notes:            fd.get('notes') || null
          })
        });

        var result = await res.json();

        if (result.success) {
          sessionStorage.setItem('orderSuccess', JSON.stringify({
            reference_number: result.data.reference_number,
            customer_name:  name,
            customer_phone: phone,
            governorate:    opt.textContent,
            subtotal:       subtotal,
            shipping_cost:  currentShipping,
            discount:       discount,
            coupon_code:    couponCode,
            total:          result.data.total || total,
            items:          cart
          }));
          localStorage.removeItem('bird_cart');
          localStorage.removeItem('ordersaif_coupon_code');
          localStorage.removeItem('ordersaif_coupon_type');
          localStorage.removeItem('ordersaif_coupon_value');
          localStorage.removeItem('ordersaif_coupon_discount');
          window.location.href = '/shop/order-success.html?ref=' + result.data.reference_number;
        } else {
          var errorDetails = '';
          if (result.errors) {
             for (var key in result.errors) {
                errorDetails += '\n- ' + result.errors[key].join(', ');
             }
          }
          alert((result.message || 'حدث خطأ أثناء إتمام الطلب') + errorDetails);
          btn.innerHTML = orig;
          btn.disabled = false;
        }
      } catch (err) {
        alert('تعذر الاتصال بالخادم، يرجى المحاولة لاحقاً');
        btn.innerHTML = orig;
        btn.disabled = false;
      }
    });

    /* ---- Settings dynamic loader ---- */
    (function(){
      fetch('/public-api/settings').then(function(r){return r.json();}).then(function(res){
        var d = res.data; if(!d) return;
        if(d.logo_url) document.querySelectorAll('.brand img').forEach(function(el){el.src=d.logo_url;});
        if(d.store_name) document.querySelectorAll('.brand span').forEach(function(el){el.textContent=d.store_name;});
        if(d.whatsapp) document.querySelectorAll('a.wapp-float').forEach(function(el){el.href='https://wa.me/'+d.whatsapp;});
        if(d.phone) document.querySelectorAll('a[href^="tel:"]').forEach(function(el){el.href='tel:'+d.phone;});
      }).catch(function(){});
    })();

    /* ---- Init ---- */
    window.updateShipping = updateShipping;
    BirdCart.updateCartCount();
    renderSummary();
  </script>
</body>

</html>
