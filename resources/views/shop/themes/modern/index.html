  <a class="wapp-float" id="whatsappBtn" href="https://wa.me/201146520922" target="_blank" aria-label="WhatsApp">

  <script>
    window.API_BASE = '/public-api';

    function applySettings(data) {
      if (!data) return;
      if (data.logo_url) {
        const logoEl = document.getElementById('siteLogo');
        if (logoEl) logoEl.src = data.logo_url;
      }
      if (data.store_name) {
        const nameEl = document.getElementById('siteName');
        if (nameEl) nameEl.textContent = data.store_name;
        document.title = data.store_name + ' - Modern Luxury';
      }
      if (data.phone) {
        const callBtn = document.getElementById('callBtn');
        if (callBtn) callBtn.href = 'tel:' + data.phone;
      }
      if (data.whatsapp) {
        const waBtn = document.getElementById('whatsappBtn');
        if (waBtn) waBtn.href = 'https://wa.me/' + data.whatsapp;
      }
    }

    if (window.__SITE_SETTINGS__) {
      applySettings(window.__SITE_SETTINGS__);
    } else {
      fetch(`${window.API_BASE}/settings`).then(r => r.json()).then(({ data }) => {
        window.__SITE_SETTINGS__ = data;
        applySettings(data);
      }).catch(() => { });
    }

    let currentSlideIndex = 0;
    let slides, totalSlides;
    let slideInterval = null;

    function initSlider() {
      slides = document.querySelectorAll('.slide');
      totalSlides = slides.length;
      if (totalSlides > 0) {
        let loadedImages = 0;
        slides.forEach((slide, index) => {
          const img = slide.querySelector('img');
          if (img) {
            if (img.complete) {
              loadedImages++;
            } else {
              img.onload = () => { loadedImages++; if (loadedImages === totalSlides) startSlider(); };
              img.onerror = () => { loadedImages++; if (loadedImages === totalSlides) startSlider(); };
            }
          }
        });
        setTimeout(() => { if (!slideInterval) startSlider(); }, 2000);
        if (loadedImages === totalSlides) startSlider();
      }
    }

    function startSlider() {
      showSlide(0);
      startAutoSlide();
      const sliderContainer = document.querySelector('.slider-container');
      if (sliderContainer) {
        sliderContainer.addEventListener('mouseenter', stopAutoSlide);
        sliderContainer.addEventListener('mouseleave', startAutoSlide);
      }
    }

    function showSlide(index) {
      if (!slides || slides.length === 0) return;
      if (index >= totalSlides) index = 0;
      if (index < 0) index = totalSlides - 1;
      currentSlideIndex = index;
      slides.forEach(slide => slide.classList.remove('active'));
      if (slides[currentSlideIndex]) slides[currentSlideIndex].classList.add('active');
      const slidesContainer = document.querySelector('.slides');
      if (slidesContainer) {
        slidesContainer.style.transform = `translateX(${currentSlideIndex * (document.dir === 'rtl' ? 100 : -100)}%)`;
      }
    }

    function changeSlide(direction) {
      stopAutoSlide();
      showSlide(currentSlideIndex + direction);
      startAutoSlide();
    }

    function startAutoSlide() {
      if (slideInterval) clearInterval(slideInterval);
      slideInterval = setInterval(() => { showSlide(currentSlideIndex + 1); }, 5000);
    }

    function stopAutoSlide() {
      if (slideInterval) { clearInterval(slideInterval); slideInterval = null; }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const slides = document.querySelectorAll('.slide');
      if (slides && slides.length > 0) initSlider();
    });
  </script>
  <script src="/shop/shared.js?v=20260714"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    if (window.__SITE_SETTINGS__) {
      renderHomepageLayout(window.__SITE_SETTINGS__);
      loadHomepageContent(window.__SITE_SETTINGS__);
    } else {
      fetch(`${window.API_BASE}/settings`).then(r => r.json()).then(({ data }) => {
        window.__SITE_SETTINGS__ = data;
        renderHomepageLayout(data);
        loadHomepageContent(data);
      }).catch(() => {
        const fallbackSettings = {
          homepage_sections: [
            {id: 'hero_slider', enabled: true},
            {id: 'featured_categories', enabled: true},
            {id: 'best_offers', enabled: true},
            {id: 'latest_products', enabled: true}
          ]
        };
        renderHomepageLayout(fallbackSettings);
        loadHomepageContent(fallbackSettings);
      });
    }

    function loadHomepageContent(settings) {
      const sections = settings.homepage_sections || [];
      const isHeroEnabled = !sections.length || sections.some(s => s.id === 'hero_slider' && s.enabled);
      const isCategoriesEnabled = !sections.length || sections.some(s => s.id === 'featured_categories' && s.enabled);
      const isOffersEnabled = !sections.length || sections.some(s => s.id === 'best_offers' && s.enabled);
      const isLatestEnabled = !sections.length || sections.some(s => s.id === 'latest_products' && s.enabled);

      const lang = getStorefrontLang();

      if (isHeroEnabled) {
        fetch(`${window.API_BASE}/banners`).then(r => r.json()).then(({ data }) => {
          const slider = document.querySelector('.slides');
          if (slider && data && data.length) {
            slider.innerHTML = data.map((b, i) => `
              <div class="slide ${i === 0 ? 'active' : ''}">
                ${b.link ? `<a href="${b.link}">` : ''}
                  <img src="/storage/${b.image_path}" alt="${b.title || 'بنر إعلاني'}">
                ${b.link ? `</a>` : ''}
              </div>
            `).join('');
            initSlider();
          }
        }).catch(() => {});
      }

      if (isCategoriesEnabled) {
        let catsSource = null;
        if (settings && settings.main_categories && Array.isArray(settings.main_categories)) {
          catsSource = Promise.resolve({ data: settings.main_categories });
        } else if (settings && settings.homepage_featured_categories && Array.isArray(settings.homepage_featured_categories) && settings.homepage_featured_categories.length > 0) {
          catsSource = Promise.resolve({ data: settings.homepage_featured_categories });
        } else {
          catsSource = fetch(`${window.API_BASE}/categories`).then(r => r.json());
        }

        catsSource.then(({ data }) => {
          const grid = document.getElementById('categoriesGrid');
          if (grid && data && data.length) {
            grid.innerHTML = data.map(cat => `
              <a href="/shop/category-products.html?category_id=${cat.id}" class="category-card animate-fade-scale" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; background:var(--bg-surface); border-radius:var(--radius-lg); padding:1.5rem; border:1px solid var(--border-color); transition:var(--transition-smooth);">
                <div style="width:100px; height:100px; border-radius:50%; overflow:hidden; background:#f1f5f9; margin-bottom:1rem; border:2px solid #fff; box-shadow:var(--shadow-sm);">
                  <img src="${cat.image_url || '/images/default-cat.png'}" alt="${cat.name}" style="width:100%; height:100%; object-fit:cover;" onerror="this.src='https://dummyimage.com/150x150/09090b/ffffff&text=CAT'">
                </div>
                <h3 style="font-size:1.1rem; font-weight:800; color:var(--text-main); margin:0;">${cat.name}</h3>
              </a>
            `).join('');
          }
        }).catch(() => {});
      }

      if (isOffersEnabled || isLatestEnabled) {
        fetch(`${window.API_BASE}/products`).then(r => r.json()).then(({ data }) => {
          if (!data || !data.length) return;

          if (isOffersEnabled) {
            const discountedProducts = data.filter(p => (p.price_after && parseFloat(p.price_after) < parseFloat(p.price)) || (p.discount_price && parseFloat(p.discount_price) < parseFloat(p.price)));
            const bestOffersLimit = settings.homepage_best_offers_limit ? parseInt(settings.homepage_best_offers_limit) : 4;
            const offersGrid = document.getElementById('offersGrid');
            if (offersGrid) {
              if (discountedProducts.length > 0) {
                renderProducts(offersGrid, discountedProducts.slice(0, bestOffersLimit));
              } else {
                offersGrid.innerHTML = '<p class="muted" style="grid-column:1/-1; text-align:center;">' + (lang === 'en' ? 'No offers available currently.' : 'لا توجد عروض متاحة حالياً.') + '</p>';
              }
            }
          }

          if (isLatestEnabled) {
            const latestProductsLimit = settings.homepage_latest_products_limit ? parseInt(settings.homepage_latest_products_limit) : 4;
            const productsGrid = document.getElementById('productsGrid');
            if (productsGrid) {
              renderProducts(productsGrid, data.slice(0, latestProductsLimit));
            }
          }
        }).catch(() => {});
      }
    }
  </script>
