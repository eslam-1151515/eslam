<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار سريع للطلب</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>اختبار سريع للطلب</h1>
    <button onclick="testOrder()">اختبار إنشاء طلب</button>
    <div id="result"></div>

    <script>
        async function testOrder() {
            const btn = document.querySelector('button');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            btn.textContent = 'جاري الإرسال...';
            
            const orderData = {
                customer_name: 'أحمد محمد',
                customer_phone: '01234567890',
                customer_address: 'شارع 15، المعادي، القاهرة',
                governorate_id: 1,
                payment_method: 'cod',
                items: [
                    { id: 1, name: 'منتج تجريبي', price: 100, qty: 2 }
                ],
                notes: 'طلب تجريبي'
            };
            
            try {
                console.log('Sending order data:', orderData);
                
                const response = await fetch('/api/orders', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(orderData)
                });
                
                console.log('Response status:', response.status);
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.success) {
                    result.innerHTML = `
                        <h3 style="color: green;">✅ نجح الطلب!</h3>
                        <p>رقم الطلب: ${data.data.reference_number}</p>
                        <p>الإجمالي: ${data.data.total} جنيه</p>
                    `;
                } else {
                    result.innerHTML = `
                        <h3 style="color: red;">❌ فشل الطلب</h3>
                        <p>${data.message}</p>
                    `;
                }
                
            } catch (error) {
                console.error('Error:', error);
                result.innerHTML = `
                    <h3 style="color: red;">❌ خطأ في الشبكة</h3>
                    <p>${error.message}</p>
                `;
            }
            
            btn.disabled = false;
            btn.textContent = 'اختبار إنشاء طلب';
        }
    </script>
</body>
</html>
