<body>

      <a href="/shop/index.html" class="brand">
        <img id="siteLogo" src="/images/logo.png?v=202604031" alt="Store"
          onerror="this.src='https://dummyimage.com/48x48/09090b/ffffff&text=S'" />
        <span id="siteName">Store</span>
      </a>

      <nav class="nav">
        <a href="/shop/index.html" class="active">الرئيسية</a>
        <a href="/shop/products.html">جميع المنتجات</a>
        <a href="/shop/categories.html">الأقسام</a>
        <a href="/shop/products.html?sort=discount">عروض حصرية</a>
        <a style="display:none !important;" href="/shop/contact.html">اتصل بنا</a>
      </nav>

      <div class="icons">
        <a href="#" class="icon-round search-trigger" title="بحث" aria-label="بحث"><i class="fa fa-search"></i></a>
        <a id="cartIcon" class="icon-round" href="/shop/cart.html" title="السلة" aria-label="السلة">
          <i class="fa-solid fa-bag-shopping"></i>
          <span id="cartCount"></span>
        </a>
        <button class="menu-toggle" aria-label="القائمة"><span></span><span></span><span></span></button>

    </div>
  </header>

  <!-- Homepage Dynamic Sections Wrapper -->
  <main id="homepageSections">
    <!-- Hero Slider -->
    <section id="sec-hero_slider" class="hero-slider" style="display: none;">
      <div class="slider-container">
        <div class="slides">
          <div class="slide active">
            <img src="/storage/banners/default_banner_1.jpg" alt="عرض خاص">
          </div>
          <div class="slide">
            <img src="/storage/banners/default_banner_2.jpg" alt="تشكيلة جديدة">
          </div>
        </div>

        <!-- Navigation arrows -->
        <button class="slider-btn prev" onclick="changeSlide(-1)">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
        <button class="slider-btn next" onclick="changeSlide(1)">
          <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </section>

    <!-- Best offers section -->
    <section id="sec-best_offers" class="section container" style="display: none;">
      <div class="section-head">
        <h2 id="title-best_offers">أفضل العروض والخصومات</h2>
        <a class="more" href="/shop/products.html?sort=discount">عرض الكل</a>
      </div>
      <div id="offersGrid" class="grid"></div>
    </section>

    <!-- Products grid -->
    <section id="sec-latest_products" class="section container" style="display: none;">
      <div class="section-head">
        <h2 id="title-latest_products">أحدث المنتجات</h2>
        <a class="more" href="/shop/products.html">عرض الكل</a>
      </div>
      <div id="homeProductsGrid" class="grid"></div>
    </section>
  </main>

  <footer class="container footer">
    <p>© <span id="year"></span> <span id="footerStoreName"></span>. جميع الحقوق محفوظة • مشغل بواسطة منصة <a href="http://ordersaif.com" target="_blank" rel="noopener" style="color:#09090b;font-weight:bold;text-decoration:underline">Order Saif</a></p>
  </footer>

  <script>
    // Slider functionality
    let currentSlideIndex = 0;
    let totalSlides = 0;

    function initSlider() {
      const slides = document.querySelectorAll('.slide');
      totalSlides = slides.length;

      if (totalSlides === 0) return;

      // Ensure first slide is active
      slides.forEach((slide, index) => {
        slide.classList.toggle('active', index === 0);
      });

      currentSlideIndex = 0;
      updateSliderPosition();
      startAutoSlide();
    }

    function showSlide(index) {
      const slides = document.querySelectorAll('.slide');
      totalSlides = slides.length;

      if (totalSlides === 0) return;

      // Handle wraparound
      if (index >= totalSlides) {
        currentSlideIndex = 0;
      } else if (index < 0) {
        currentSlideIndex = totalSlides - 1;
      } else {
        currentSlideIndex = index;
      }

      // Update active class
      slides.forEach((slide, idx) => {
        slide.classList.toggle('active', idx === currentSlideIndex);
      });

      updateSliderPosition();
    }

    function updateSliderPosition() {
      const slidesContainer = document.querySelector('.slides');
      if (slidesContainer) {
        const offset = currentSlideIndex * -100;
        slidesContainer.style.transform = `translateX(${offset}%)`;
      }
    }

    function changeSlide(direction) {
      stopAutoSlide();
      let newIndex = currentSlideIndex + direction;
      showSlide(newIndex);
      startAutoSlide();
    }

    // Auto-slide functionality (fast 2.5 seconds)
    function autoSlide() {
      let nextIndex = currentSlideIndex + 1;
      if (nextIndex >= totalSlides) {
        nextIndex = 0;
      }
      showSlide(nextIndex);
    }

    let slideInterval;
    function startAutoSlide() {
      if (slideInterval) {
        clearInterval(slideInterval);
      }
      slideInterval = setInterval(autoSlide, 2500); // 2.5s fast autoplay
    }

    function stopAutoSlide() {
      if (slideInterval) {
        clearInterval(slideInterval);
        slideInterval = null;
      }
    }

    window.addEventListener('load', function () {
      if (!slideInterval) {
        const slides = document.querySelectorAll('.slide');
        if (slides && slides.length > 0) {
          initSlider();
        }
      }
    });
  </script>
  <script>
    window.API_BASE = '/public-api';
  </script>
  <script src="/shop/shared.js?v=20260825_V1"></script>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // 1. apply layout ordering and loading
    if (window.__SITE_SETTINGS__) {
      renderHomepageLayout(window.__SITE_SETTINGS__);
      loadHomepageContent(window.__SITE_SETTINGS__);
    } else {
      fetch(`${window.API_BASE}/settings`).then(r => r.json()).then(({ data }) => {
        window.__SITE_SETTINGS__ = data;
        renderHomepageLayout(data);
        loadHomepageContent(data);
      }).catch(() => {
        const fallbackSettings = {
          homepage_sections: [
            {id: 'hero_slider', enabled: true},
            {id: 'best_offers', enabled: true},
            {id: 'latest_products', enabled: true}
          ]
        };
        renderHomepageLayout(fallbackSettings);
        loadHomepageContent(fallbackSettings);
      });
    }

    function loadHomepageContent(settings) {
      const sections = settings.homepage_sections || [];
      const isHeroEnabled = !sections.length || sections.some(s => s.id === 'hero_slider' && s.enabled);
      const isOffersEnabled = !sections.length || sections.some(s => s.id === 'best_offers' && s.enabled);
      const isLatestEnabled = !sections.length || sections.some(s => s.id === 'latest_products' && s.enabled);

      const lang = getStorefrontLang();

      // Update store name in footer
      const footerStore = document.getElementById('footerStoreName');
      if (footerStore && settings.store_name) {
        footerStore.textContent = settings.store_name;
      }

      // Load Hero Slider banners if enabled
      if (isHeroEnabled) {
        fetch(`${window.API_BASE}/banners`).then(r => r.json()).then(({ data }) => {
          const slider = document.querySelector('.slides');
          if (slider && data && data.length) {
            slider.innerHTML = data.map((b, i) => `
              <div class="slide ${i === 0 ? 'active' : ''}">
                <a href="${b.link ? b.link : '#'}">
                  <img src="${b.image_url}" alt="${b.title || 'Store'}">
                </a>
              </div>
            `).join('');
          }
          setTimeout(function () {
            initSlider();
          }, 100);
        }).catch(e => {
          console.error(e);
          setTimeout(function () {
            initSlider();
          }, 100);
        });
      }

      // Load Best Offers
      if (isOffersEnabled) {
        renderSkeletonProducts(document.getElementById('offersGrid'), 4);
        const offersLimit = settings.homepage_best_offers_limit || 4;
        fetch(`${window.API_BASE}/products?sort=discount&limit=${offersLimit}`).then(r => r.json()).then(({ data }) => {
          renderProducts(document.getElementById('offersGrid'), data);
        }).catch(() => {
          document.getElementById('offersGrid').innerHTML = '<p class="muted">' + (lang === 'en' ? 'Unable to load offers.' : 'لا يمكن تحميل العروض الآن.') + '</p>';
        });
      }

      // Load Latest Products
      if (isLatestEnabled) {
        renderSkeletonProducts(document.getElementById('homeProductsGrid'), 4);
        const latestLimit = settings.homepage_latest_products_limit || 8;
        fetch(`${window.API_BASE}/products?limit=${latestLimit}`).then(r => r.json()).then(({ data }) => {
          renderProducts(document.getElementById('homeProductsGrid'), data, true);
        }).catch(() => {
          document.getElementById('homeProductsGrid').innerHTML = '<p class="muted">' + (lang === 'en' ? 'Unable to load products.' : 'لا يمكن تحميل المنتجات الآن.') + '</p>';
        });
      }
    }
  </script>
</body>
